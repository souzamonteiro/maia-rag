# Install on the RAG machine. Node remains on 127.0.0.1:4310.
server {
    listen 10.77.0.2:4311;
    server_name rag.maiaplatform.org;
    allow 10.77.0.1;
    deny all;
    client_max_body_size 101m;

    location / {
        # Reject cross-origin browser mutations even with cached Basic credentials.
        # Empty Origin supports CLI clients; browser UI uses the public HTTPS origin.
        if ($http_origin !~ "^(https://rag\.maiaplatform\.org)?$") { return 403; }
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Proxy-Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_cache off;
    }
}
